[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotune"
version = "0.1.0"
description = "Zero-shot vs few-shot vs QLoRA LLMs for emotion classification"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pydantic>=2.5",
]

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.43", "accelerate>=0.30"]
finetune = ["emotune[hf]", "peft>=0.11", "bitsandbytes>=0.43", "datasets>=2.19"]
data = ["datasets>=2.19"]
all = ["emotune[finetune]"]
dev = ["pytest>=8"]

[project.scripts]
emotune = "emotune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
